---
name: dist

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - '*'

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "macos-13", "macos-14", "windows-2022"]
        python_version:
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        architecture: [x64]
        # exclude:
        # - os: macos-13
        #   architecture: x86
        # - os: ubuntu-22.04
        #   architecture: x86
        include:
        - os: macos-14
          python_version: 3.9
          architecture: arm64
        - os: ubuntu-22.04-arm
          python_version: 3.11
          architecture: arm64

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
        architecture: ${{ matrix.architecture }}

    # - name: Setup MSVC
    #   uses: bus1/cabuild/action/msdevshell@e22aba57d6e74891d059d66501b6b5aed8123c4d  # v1
    #   with:
    #     architecture: x64
    #   if: runner.os == 'Windows'

    - name: Install Linux requirements
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

    - name: Install build tool
      run: |
        python -m pip --disable-pip-version-check install build

    - name: Build wheel
      run: |
        python -m build

    - uses: actions/upload-artifact@v4
      with:
        name: "pypi-${{ runner.os }}-${{ matrix.architecture }}-${{ matrix.python_version }}"
        path: dist

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: pypi-*
        path: dist/
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
